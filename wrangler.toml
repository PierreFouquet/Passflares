# ============================================================
#  Heads up — forking this project?
#  The IDs in this file (D1 database_id, KV namespace id, R2
#  bucket_name, the passflares.com route) belong to the
#  upstream maintainer's Cloudflare account. They are not
#  secrets, but they will NOT work for you — `wrangler deploy`
#  will fail with permission errors until you swap them out.
#
#  See `wrangler.toml.example` for a clean template with
#  step-by-step instructions for setting up your own
#  Cloudflare resources.
# ============================================================

name = "passflares"
main = "src/worker.ts"
compatibility_date = "2026-08-07"
compatibility_flags = [ "nodejs_compat" ]
tsconfig = "tsconfig.json"

routes = [
    # `pattern` is the exact host(+path) the Worker handles; `zone_name` is the
    # Cloudflare zone that owns the DNS — the apex `passflares.com`. A proxied
    # (orange-cloud) DNS record must exist for each host below, or the route
    # receives no traffic. `www` serves the same Worker, which 301-redirects
    # every www request to the apex (see redirectToCanonicalHost in worker.ts).
    { pattern = "passflares.com/*", zone_name = "passflares.com" },
    { pattern = "www.passflares.com/*", zone_name = "passflares.com" }
]
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
# Run the Worker for every request — including static assets — so the
# security-header layer in src/worker.ts (CSP, HSTS, etc.) is actually
# applied to HTML/JS/CSS responses. Without this, Cloudflare serves assets
# directly from its CDN and skips the Worker entirely.
run_worker_first = true

# ========================
# PRODUCTION ENVIRONMENT
# JWT_SECRET, TURNSTILE_KEY, and TOTP_ENC_KEY are stored as Cloudflare secrets.
# To update: wrangler secret put JWT_SECRET
# TOTP_ENC_KEY encrypts users' TOTP secrets at rest — set a long random value
# (>= 32 chars); rotating it invalidates existing 2FA enrolments.
# ========================

[[r2_buckets]]
binding = "VAULTS"
bucket_name = "secure-vaults-r2"

# Brute-force limiter. This replaced a KV namespace: the counter needs an atomic
# read-modify-write and strong consistency, and KV offers neither, so the "5
# attempts per 15 minutes" lockout was bypassable by sending requests
# concurrently (GHSA-vp89-22wm-gjr8). One instance per limiter subject — one IP
# or one account — never a global singleton.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

# new_sqlite_classes, not new_classes: key-value backed Durable Object
# namespaces can no longer be created, and SQLite-backed objects are the only
# kind the Workers Free plan has ever supported.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[[d1_databases]]
binding = "DB"
database_name = "secure-password-db"
database_id = "b7de341a-1977-44c3-9641-9f455e87a207"

# ========================
# SCHEDULED TASKS
# ========================
# Nightly audit-log retention sweep (03:17 UTC — off the hour, so it isn't
# competing with everyone else's midnight cron). See scheduled() in
# src/worker.ts; the window is AUDIT_RETENTION_DAYS in src/auditLog.ts.
[triggers]
crons = ["17 3 * * *"]

# ========================
# OBSERVABILITY
# ========================
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true